name: Sync labels

# Creates or updates the labels from .github/labels.yml. Existing labels that are not listed are kept.
on:
  push:
    branches: [main]
    paths: [.github/labels.yml]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # yq is preinstalled on GitHub-hosted Ubuntu runners.
      - name: Create or update labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          yq -o=json '.' .github/labels.yml | jq -c '.[]' | while read -r label; do
            gh label create "$(jq -r '.name' <<< "$label")" \
              --color "$(jq -r '.color' <<< "$label")" \
              --description "$(jq -r '.description' <<< "$label")" \
              --force
          done
